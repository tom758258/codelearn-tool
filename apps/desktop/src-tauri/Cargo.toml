[package]
name = "codelearn-tool-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
codelearn-tool-core = { path = "../../../crates/codelearn-tool-core" }
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.23"
same-file = "1.0.6"
percent-encoding = "2.3"
