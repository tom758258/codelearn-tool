name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Share frontend assets with Tauri checks
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  core:
    name: Core ${{ matrix.platform }}
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Detect toolchain integration changes
        id: toolchain-changes
        uses: dorny/paths-filter@v4
        with:
          # Pushes compare with event.before; PRs use the changed-files API.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            integration:
              - 'crates/codelearn-tool-core/src/**'
              - 'crates/codelearn-tool-core/tests/**'
              - 'crates/codelearn-tool-core/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
      - name: Prepare UCRT64 GCC and GDB
        if: runner.os == 'Windows' && steps.toolchain-changes.outputs.integration == 'true'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gdb
      - name: Test with real GCC and GDB (Windows MSVC)
        if: runner.os == 'Windows' && steps.toolchain-changes.outputs.integration == 'true'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchainBin = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $env:CODELEARN_TEST_GCC = (Get-Item -LiteralPath (Join-Path $toolchainBin 'gcc.exe')).FullName
          $env:CODELEARN_TEST_GDB = (Get-Item -LiteralPath (Join-Path $toolchainBin 'gdb.exe')).FullName
          # Keep UCRT64 runtime DLLs and compiler subprocesses on this step's PATH.
          $env:PATH = "$toolchainBin;$env:PATH"
          $env:CODELEARN_TEST_REQUIRE_PATH = '1'
          foreach ($tool in @($env:CODELEARN_TEST_GCC, $env:CODELEARN_TEST_GDB)) {
            Write-Output "Tool: $tool"
            & $tool --version
            if ($LASTEXITCODE -ne 0) { throw "Version check failed: $tool" }
          }
          cargo test --workspace --locked --test build -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test with real GCC and GDB (Linux)
        if: runner.os == 'Linux' && steps.toolchain-changes.outputs.integration == 'true'
        shell: bash
        run: |
          missing=()
          command -v gcc >/dev/null || missing+=(gcc)
          command -v gdb >/dev/null || missing+=(gdb)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "${missing[@]}"
          fi
          CODELEARN_TEST_GCC=$(readlink -f "$(command -v gcc)")
          CODELEARN_TEST_GDB=$(readlink -f "$(command -v gdb)")
          test -x "$CODELEARN_TEST_GCC"
          test -x "$CODELEARN_TEST_GDB"
          export CODELEARN_TEST_GCC CODELEARN_TEST_GDB
          export CODELEARN_TEST_REQUIRE_PATH=1
          printf 'GCC: %s\nGDB: %s\n' "$CODELEARN_TEST_GCC" "$CODELEARN_TEST_GDB"
          "$CODELEARN_TEST_GCC" --version
          "$CODELEARN_TEST_GDB" --version
          cargo test --workspace --locked --test build -- --ignored --nocapture

  tauri:
    name: Tauri ${{ matrix.platform }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Tauri
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Clippy Tauri
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Tauri
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Tauri
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
