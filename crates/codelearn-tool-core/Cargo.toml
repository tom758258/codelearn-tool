[package]
name = "codelearn-tool-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
same-file = "1.0.6"
tempfile = "3.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
